name: SEO checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Report full-repository lint (existing issues)
        run: |
          if npm run lint > lint-full.txt 2>&1; then
            echo 'Full repository lint: passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Full repository lint: existing failures remain; see lint-full.txt. Changed SEO files are checked strictly below.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Lint SEO changes
        run: >-
          npm run lint --
          'app/(es)/layout.jsx' 'app/(es)/page.jsx' 'app/(es)/not-found.jsx'
          'app/(es)/privacy/page.jsx' 'app/(es)/support/page.jsx' 'app/(es)/terms/page.jsx'
          app/DocumentRoot.jsx app/SoftwareApplication.jsx app/OrdivyLogo.jsx
          app/OrdivyLanding.jsx app/OrdivyLandingEn.jsx app/home-seo.js app/site-metadata.js
          app/en/layout.jsx app/en/page.jsx 'app/en/[...missing]/page.jsx' app/global-not-found.jsx
          next.config.ts scripts/check-seo.mjs scripts/summarize-lighthouse.mjs scripts/measure-lighthouse.mjs
      - run: npm run typecheck
      - run: node --test 'app/(es)/auth/recovery.test.mjs'
      - run: npm run build
      - name: Check generated production HTML
        run: |
          npm start > /tmp/ordivy-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-seo.mjs
      - name: Build baseline for comparable measurements
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'main' }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/ordivy-baseline" "$BASE_REF"
          npm ci --prefix "$RUNNER_TEMP/ordivy-baseline"
          npm run build --prefix "$RUNNER_TEMP/ordivy-baseline"
          npm start --prefix "$RUNNER_TEMP/ordivy-baseline" -- --port 3001 > /tmp/ordivy-baseline.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3001 > /dev/null; then break; fi
            sleep 1
          done
      - name: Compare mobile pages with warmups and alternating samples
        run: node scripts/measure-lighthouse.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Check mobile and desktop interactions
        env:
          BROWSER_CHECK_ROOT: ${{ runner.temp }}/ordivy-browser-check
        run: |
          mkdir -p "$BROWSER_CHECK_ROOT"
          npm install --prefix "$BROWSER_CHECK_ROOT" --no-package-lock playwright@1.58.2
          node scripts/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-mobile-comparison
          path: |
            lighthouse/*.json
            lint-full.txt
            browser-check/*.png
