name: SEO checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node --test 'app/(es)/auth/recovery.test.mjs'
      - run: npm run build
      - name: Check generated production HTML
        run: |
          npm start > /tmp/ordivy-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-seo.mjs
      - name: Measure updated mobile pages
        run: |
          mkdir -p lighthouse
          npx --yes lighthouse@13.5.0 http://localhost:3000 --chrome-flags="--headless --no-sandbox" --only-categories=performance,seo,accessibility --output=json --output-path=lighthouse/updated-es.json --quiet
          npx --yes lighthouse@13.5.0 http://localhost:3000/en --chrome-flags="--headless --no-sandbox" --only-categories=performance,seo,accessibility --output=json --output-path=lighthouse/updated-en.json --quiet
      - name: Build baseline for comparable measurements
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'main' }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/ordivy-baseline" "$BASE_REF"
          npm ci --prefix "$RUNNER_TEMP/ordivy-baseline"
          npm run build --prefix "$RUNNER_TEMP/ordivy-baseline"
          npm start --prefix "$RUNNER_TEMP/ordivy-baseline" -- --port 3001 > /tmp/ordivy-baseline.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3001 > /dev/null; then break; fi
            sleep 1
          done
      - name: Measure baseline mobile pages
        run: |
          npx --yes lighthouse@13.5.0 http://localhost:3001 --chrome-flags="--headless --no-sandbox" --only-categories=performance,seo,accessibility --output=json --output-path=lighthouse/baseline-es.json --quiet
          npx --yes lighthouse@13.5.0 http://localhost:3001/en --chrome-flags="--headless --no-sandbox" --only-categories=performance,seo,accessibility --output=json --output-path=lighthouse/baseline-en.json --quiet
          node scripts/summarize-lighthouse.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-mobile-comparison
          path: lighthouse/*.json
